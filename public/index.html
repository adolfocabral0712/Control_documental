<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#123d35">
  <title>Control documental</title>

  <style>
    :root {
      --green-950:#0b2b26;
      --green-900:#123d35;
      --green-800:#185247;
      --green-700:#246b58;
      --green-50:#f1faf6;
      --ink:#17231f;
      --muted:#687872;
      --line:#d7e2dd;
      --surface:#fff;
      --page:#eef3f1;
      --red:#b42318;
      --red-bg:#fff0ee;
      --amber:#9a6700;
      --amber-bg:#fff6d8;
      --gray:#667085;
      --gray-bg:#f2f4f7;
      --shadow:0 12px 34px rgba(18,61,53,.09);
    }

    * {
      box-sizing:border-box;
    }

    html {
      min-width:320px;
      font-size:15px;
    }

    body {
      margin:0;
      min-height:100vh;
      background:var(--page);
      color:var(--ink);
      font-family:Inter,Segoe UI,Arial,sans-serif;
      font-size:1rem;
    }

    button,
    input,
    select {
      font:inherit;
    }

    .topbar {
      padding:22px clamp(18px,3vw,44px);
      color:#fff;
      background:linear-gradient(115deg,var(--green-950),var(--green-800));
      box-shadow:0 6px 22px rgba(11,43,38,.18);
    }

    .topbar-inner {
      max-width:1800px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    h1 {
      margin:0;
      font-size:clamp(1.35rem,2.3vw,2rem);
      letter-spacing:.02em;
    }

    .subtitle {
      margin-top:5px;
      color:#d8ebe4;
    }

    .updated {
      color:#d8ebe4;
      font-size:.88rem;
      text-align:right;
    }

    main {
      max-width:1800px;
      margin:0 auto;
      padding:22px clamp(12px,2.4vw,34px) 38px;
    }

    .overview {
      display:grid;
      grid-template-columns:minmax(180px,230px) minmax(180px,230px) minmax(420px,1fr);
      gap:14px;
      margin-bottom:18px;
      align-items:stretch;
    }

    .card {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:16px 18px;
      text-align:center;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
    }

    .card-label {
      width:100%;
      color:var(--muted);
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.06em;
      text-align:center;
      text-transform:uppercase;
    }

    .card-value {
      width:100%;
      margin-top:8px;
      color:var(--green-900);
      font-size:1.65rem;
      font-weight:800;
      text-align:center;
    }

    .trozas-card {
      cursor:pointer;
    }

    .trozas-card.risk {
      border-color:#e3a09a;
      background:var(--red-bg);
    }

    .trozas-card.risk .card-value {
      color:var(--red);
    }

    .trozas-card.safe {
      border-color:#9dd9bb;
      background:#effaf4;
    }

    .trozas-card.safe .card-value {
      color:#087443;
    }

    .trozas-card.active {
      outline:3px solid rgba(180,35,24,.18);
    }

    .summary-card {
      padding:0;
      overflow:hidden;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
    }

    .summary-title {
      padding:10px 14px;
      color:var(--green-900);
      font-size:.82rem;
      font-weight:800;
      letter-spacing:.05em;
      text-align:center;
      text-transform:uppercase;
      border-bottom:1px solid var(--line);
    }

    .summary-table {
      width:100%;
      min-width:0;
      table-layout:fixed;
      border-collapse:collapse;
    }

    .summary-table th {
      position:static;
      padding:7px 10px;
      color:var(--green-950);
      font-size:.74rem;
      background:#e8f0ed;
      cursor:default;
    }

    .summary-table th:hover {
      background:#e8f0ed;
    }

    .summary-table td {
      padding:6px 10px;
      font-size:.82rem;
    }

    .summary-table th:first-child,
    .summary-table td:first-child {
      width:44%;
      text-align:left;
      font-weight:750;
    }

    .summary-table th:nth-child(2),
    .summary-table td:nth-child(2),
    .summary-table th:nth-child(3),
    .summary-table td:nth-child(3) {
      width:28%;
      text-align:center;
    }

    .summary-warn {
      color:var(--amber);
      font-weight:850;
    }

    .summary-bad {
      color:var(--red);
      font-weight:850;
    }

    .summary-count {
      width:100%;
      min-width:38px;
      min-height:28px;
      color:inherit;
      font-weight:850;
      background:rgba(255,255,255,.45);
      border:1px solid transparent;
      border-radius:8px;
      cursor:pointer;
    }

    .summary-count:hover,
    .summary-count:focus-visible {
      background:#fff;
      border-color:currentColor;
      outline:none;
    }

    .summary-warn .summary-count.active {
      background:var(--amber-bg);
      border-color:var(--amber);
      box-shadow:0 0 0 2px rgba(154,103,0,.12);
    }

    .summary-bad .summary-count.active {
      background:var(--red-bg);
      border-color:var(--red);
      box-shadow:0 0 0 2px rgba(180,35,24,.12);
    }

    .summary-count:disabled {
      opacity:.55;
      cursor:default;
      border-color:transparent;
      background:transparent;
    }

    .tabs {
      display:flex;
      gap:8px;
      padding:7px;
      margin-bottom:16px;
      overflow-x:auto;
      background:#dfe9e5;
      border-radius:14px;
    }

    .tab {
      flex:1 0 170px;
      padding:12px 18px;
      color:#395049;
      font-weight:800;
      background:transparent;
      border:0;
      border-radius:10px;
      cursor:pointer;
    }

    .tab.active {
      color:var(--green-900);
      background:var(--surface);
      box-shadow:0 4px 14px rgba(18,61,53,.12);
    }

    .panel {
      overflow:hidden;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
    }

    .toolbar {
      display:grid;
      grid-template-columns:minmax(230px,2fr) repeat(2,minmax(170px,1fr)) auto;
      gap:12px;
      align-items:end;
      padding:16px;
      border-bottom:1px solid var(--line);
    }

    label {
      display:block;
      margin:0 0 6px 2px;
      color:var(--muted);
      font-size:.8rem;
      font-weight:700;
    }

    input,
    select {
      width:100%;
      height:44px;
      padding:0 12px;
      color:var(--ink);
      background:#fff;
      border:1px solid #bdcbc5;
      border-radius:10px;
      outline:none;
    }

    input:focus,
    select:focus {
      border-color:var(--green-700);
      box-shadow:0 0 0 3px rgba(36,107,88,.13);
    }

    .clear {
      height:44px;
      padding:0 16px;
      color:var(--green-900);
      font-weight:750;
      background:#f7faf9;
      border:1px solid var(--line);
      border-radius:10px;
      cursor:pointer;
    }

    .resultbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 16px;
      color:var(--muted);
      font-size:.88rem;
      border-bottom:1px solid var(--line);
    }

    .table-wrap {
      width:100%;
      min-height:310px;
      max-height:calc(100vh - 365px);
      overflow:auto;
    }

    table {
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      white-space:nowrap;
    }

    .view-empresas {
      width:100% !important;
      min-width:900px;
      table-layout:fixed !important;
    }

    .view-empresas th,
    .view-empresas td {
      width:16.6667% !important;
      min-width:16.6667% !important;
      max-width:16.6667% !important;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    th {
      position:sticky;
      top:0;
      z-index:3;
      padding:9px 11px;
      color:#fff;
      font-size:.78rem;
      letter-spacing:.035em;
      text-align:center;
      text-transform:uppercase;
      background:var(--green-900);
      cursor:pointer;
    }

    th:hover {
      background:var(--green-800);
    }

    td {
      padding:7px 11px;
      font-size:.88rem;
      text-align:center;
      vertical-align:middle;
      border-bottom:1px solid #e7eeeb;
    }

    .view-vehiculos th {
      font-size:.72rem;
    }

    .view-vehiculos td {
      font-size:.82rem;
    }

    tbody tr:hover td {
      background:var(--green-50);
    }

    tbody tr:last-child td {
      border-bottom:0;
    }

    .sticky-first {
      position:sticky;
      left:0;
      z-index:2;
      background:#fff;
      box-shadow:5px 0 10px rgba(18,61,53,.05);
    }

    th.sticky-first {
      z-index:5;
      background:var(--green-900);
    }

    tbody tr:hover .sticky-first {
      background:var(--green-50);
    }

    .name {
      color:var(--green-950);
      font-weight:750;
    }

    .secondary {
      margin-top:3px;
      color:var(--muted);
      font-size:.78rem;
    }

    .status {
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:24px;
      height:24px;
      font-size:.82rem;
      font-weight:900;
      line-height:1;
      border-radius:50%;
      cursor:help;
    }

    .status[data-tooltip]::after {
      content:attr(data-tooltip);
      position:absolute;
      left:50%;
      bottom:calc(100% + 9px);
      z-index:20;
      min-width:max-content;
      max-width:280px;
      padding:7px 10px;
      color:#fff;
      font-size:.75rem;
      font-weight:650;
      line-height:1.25;
      white-space:nowrap;
      background:var(--green-950);
      border-radius:7px;
      box-shadow:0 5px 16px rgba(11,43,38,.24);
      opacity:0;
      pointer-events:none;
      transform:translate(-50%,4px);
      transition:opacity .15s ease,transform .15s ease;
    }

    .status[data-tooltip]::before {
      content:"";
      position:absolute;
      left:50%;
      bottom:calc(100% + 4px);
      z-index:21;
      border:5px solid transparent;
      border-top-color:var(--green-950);
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%);
      transition:opacity .15s ease;
    }

    .status[data-tooltip]:hover::after,
    .status[data-tooltip]:hover::before,
    .status[data-tooltip]:focus-visible::after,
    .status[data-tooltip]:focus-visible::before {
      opacity:1;
    }

    .status[data-tooltip]:hover::after,
    .status[data-tooltip]:focus-visible::after {
      transform:translate(-50%,0);
    }

    .status[data-tooltip]:focus-visible {
      outline:2px solid var(--green-700);
      outline-offset:2px;
    }

    .ok {
      color:#087443;
      background:#e3f6ec;
    }

    .warn {
      color:var(--amber);
      background:var(--amber-bg);
    }

    .bad {
      color:var(--red);
      background:var(--red-bg);
    }

    .none {
      color:var(--gray);
      background:var(--gray-bg);
    }

    .empty,
    .loading,
    .error {
      padding:60px 20px;
      color:var(--muted);
      text-align:center;
    }

    .error {
      color:var(--red);
    }

    @media (max-width:900px) {
      .overview {
        grid-template-columns:1fr 1fr;
      }

      .summary-card {
        grid-column:1 / -1;
      }

      .toolbar {
        grid-template-columns:1fr 1fr;
      }

      .table-wrap {
        max-height:none;
      }
    }

    @media (max-width:580px) {
      .topbar-inner {
        align-items:flex-start;
        flex-direction:column;
      }

      .updated {
        text-align:left;
      }

      main {
        padding-top:14px;
      }

      .overview {
        grid-template-columns:1fr 1fr;
        gap:9px;
      }

      .card {
        padding:13px;
      }

      .card-value {
        font-size:1.35rem;
      }

      .toolbar {
        grid-template-columns:1fr;
      }

      .clear {
        width:100%;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>CONTROL DOCUMENTAL</h1>
        <div class="subtitle">Carga Camiones</div>
      </div>

        Cargando información…

    </div>

  <main>
    <section class="overview" aria-label="Resumen">
      <article class="card">

        <div class="card-value" id="totalValue">—</div>
      </article>

      <button
        class="card trozas-card"
        id="trozasCard"
        type="button"
        title="Mostrar conductores de Las Acacias con documentos vencidos"

        <div class="card-label">TROZAS UPM</div>
        <div class="card-value" id="trozasValue">—</div>
      </button>

      <article class="summary-card">
        <div class="summary-title">Resumen documental</div>

        <table class="summary-table">
          <thead>
            <tr>
              <th>Tipo documental</th>
              <th>Por vencer</th>
              <th>Vencidos</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Empresas</td>
              <td class="summary-warn">
                <button
                  class="summary-count"
                  id="summaryEmpresasWarn"
                  data-summary-view="empresas"
                  data-summary-status="POR VENCER"
                  type="button"
                >—</button>
              </td>
              <td class="summary-bad">
                <button
                  class="summary-count"
                  id="summaryEmpresasBad"
                  data-summary-view="empresas"
                  data-summary-status="VENCIDO"
                  type="button"
                >—</button>
              </td>
            </tr>

            <tr>
              <td>Vehículos</td>
              <td class="summary-warn">
                <button
                  class="summary-count"
                  id="summaryVehiculosWarn"
                  data-summary-view="vehiculos"
                  data-summary-status="POR VENCER"
                  type="button"
                >—</button>
              </td>
              <td class="summary-bad">
                <button
                  class="summary-count"
                  id="summaryVehiculosBad"
                  data-summary-view="vehiculos"
                  data-summary-status="VENCIDO"
                  type="button"
                >—</button>
              </td>
            </tr>

            <tr>
              <td>Conductores</td>
              <td class="summary-warn">
                <button
                  class="summary-count"
                  id="summaryConductoresWarn"
                  data-summary-view="conductores"
                  data-summary-status="POR VENCER"
                  type="button"
                >—</button>
              </td>
              <td class="summary-bad">
                <button
                  class="summary-count"
                  id="summaryConductoresBad"
                  data-summary-view="conductores"
                  data-summary-status="VENCIDO"
                  type="button"
                >—</button>
              </td>
            </tr>
          </tbody>
        </table>
      </article>
    </section>

    <nav class="tabs" aria-label="Secciones">
      <button class="tab active" data-view="empresas">
        EMPRESAS
      </button>

      <button class="tab" data-view="vehiculos">
        VEHÍCULOS
      </button>

      <button class="tab" data-view="conductores">
        CONDUCTORES
      </button>
    </nav>

    <section class="panel">
      <div class="toolbar">
        <div>
          <label for="search">BUSCAR</label>
          <input
            id="search"
            type="search"
            placeholder="Empresa, matrícula o conductor…"
            autocomplete="off"
          >
        </div>

        <div>
          <label for="companyFilter">EMPRESA</label>
          <select id="companyFilter">
            <option value="">Todas</option>
          </select>
        </div>

        <div>
          <label for="statusFilter">ESTADO GENERAL</label>
          <select id="statusFilter">
            <option value="">Todos</option>
          </select>
        </div>

        <button class="clear" id="clearFilters" type="button">
          Limpiar
        </button>
      </div>

      <div class="resultbar">
        <span id="resultCount">Cargando…</span>
        <span>Haz clic en un encabezado para ordenar</span>
      </div>

      <div class="table-wrap" id="tableWrap">
        <div class="loading">
          Cargando datos documentales…
        </div>
      </div>
    </section>
  </main>

  <script>
    const SOURCE = "/api/datos";

    const state = {

          ],
          [
            "estado_mtss",
            "MTSS",
            "status"
          ],
          [
            "estado_bps",
            "BPS",
            "status"
          ]
        ]
      }
    };

    const $ = id => document.getElementById(id);

    const esc = value =>
      String(value ?? "").replace(
        /[&<>'"]/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "'": "&#39;",
          '"': "&quot;"
        })[character]
      );

    const normalize = value =>
      String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();

    const prettyDate = value => {
      if (!value) {
        return "";
      }

      const parts = String(value)
        .slice(0, 10)
        .split("-");

      const [year, month, day] = parts;

      return year && month && day
        ? `${day}/${month}/${year}`
        : value;
    };

    /*
      Calcula los días restantes sin aplicar cambios de zona horaria.

      Ejemplos:
      -1 = vencido ayer
       0 = vence hoy
       9 = vence dentro de 9 días
      10 = vence dentro de 10 días
    */
    const daysUntil = value => {
      if (!value) {
        return null;
      }

      const match = String(value)
        .slice(0, 10)
        .match(/^(\d{4})-(\d{2})-(\d{2})$/);

      if (!match) {
        return null;
      }

      const expiration = Date.UTC(
        Number(match[1]),
        Number(match[2]) - 1,
        Number(match[3])
      );

      const now = new Date();

      const today = Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      return Math.round(
        (expiration - today) / 86400000
      );
    };

    /*
      ESCALA DOCUMENTAL:

      EMPRESAS:
      - VIGENTE: 10 días o más
      - POR VENCER: entre 0 y 9 días
      - VENCIDO: menos de 0 días

      VEHÍCULOS:
      - VIGENTE: 10 días o más
      - POR VENCER: entre 0 y 9 días
      - VENCIDO: menos de 0 días

      CONDUCTORES:
      - VIGENTE: 20 días o más
      - POR VENCER: entre 0 y 19 días
      - VENCIDO: menos de 0 días
    */
    const documentStatus = (
      expirationDate,
      view = state.view
    ) => {
      const days = daysUntil(expirationDate);

      if (days === null) {
        return "SIN INFORMACION";
      }

      if (days < 0) {
        return "VENCIDO";
      }

      const limit =
        view === "conductores"
          ? 20
          : 10;

      if (days < limit) {
        return "POR VENCER";
      }

      return "VIGENTE";
    };

    const statusClass = value => {
      const status = normalize(value);

      if (
        status === "VIGENTE" ||
        status === "CUMPLE" ||
        status === "ACTIVO"
      ) {
        return "ok";
      }

      if (
        status === "VENCIDO" ||
        status === "NO CUMPLE" ||
        status === "INACTIVO"
      ) {
        return "bad";
      }

      return "warn";
    };

    const statusSymbol = value => {
      const cssClass = statusClass(value);

      if (cssClass === "ok") {
        return "✓";
      }

      if (cssClass === "bad") {
        return "✕";
      }

      return "⚠";
    };

    const statusHtml = (
      value,
      expirationDate = ""
    ) => {
      const status =
        value || "SIN INFORMACION";

      const tooltip = expirationDate
        ? `${status} · Vence: ${prettyDate(expirationDate)}`
        : status;

      return `
        <span
          class="status ${statusClass(value)}"
          data-tooltip="${esc(tooltip)}"
          aria-label="${esc(tooltip)}"
          tabindex="0"
        >${statusSymbol(value)}</span>
      `;
    };

    /*
      Calcula el Estado general a partir de todas las columnas
      documentales y de cumplimiento de cada registro.
    */
    const rowGeneralStatus = (
      row,
      view = state.view
    ) => {
      const config = configs[view];

      const statuses = config.columns
        .filter(column =>
          column[0] !== "estado_general" &&
          (
            column[2] === "doc" ||
            column[2] === "status"
          )
        )
        .map(column => {
          const field = column[0];
          const type = column[2];
          const dateField = column[3];

          if (type === "doc") {
            return documentStatus(
              row[dateField],
              view
            );
          }

          return (
            row[field] ||
            "SIN INFORMACION"
          );
        });

      if (
        statuses.some(
          status =>
            statusClass(status) === "bad"
        )
      ) {
        return "VENCIDO";
      }

      if (
        statuses.some(
          status =>
            statusClass(status) === "warn"
        )
      ) {
        return "POR VENCER";
      }

      return "VIGENTE";
    };

    const renderCell = (row, column) => {
      const [
        key,
        label,
        type,
        extra
      ] = column;

      const value = row[key];

      if (key === "estado_general") {
        return statusHtml(
          rowGeneralStatus(row)
        );
      }

      if (type === "status") {
        return statusHtml(value);
      }

      if (type === "doc") {
        const calculatedStatus =
          documentStatus(
            row[extra],
            state.view
          );

        return statusHtml(
          calculatedStatus,
          row[extra]
        );
      }

      if (type === "name") {
        const isTrailer =
          key === "matricula_carga_camiones" &&
          normalize(row.tipo_unidad_carga) ===
            "ACOPLADO";

        const truckPlate =
          isTrailer && row.matricula_camion
            ? ` / ${esc(row.matricula_camion)}`
            : "";

        const secondary =
          extra && row[extra]
            ? `
              <div class="secondary">
                ${esc(row[extra])}
              </div>
            `
            : "";

        return `
          <div class="name">
            ${esc(value || "SIN INFORMACION")}
            ${truckPlate}
          </div>
          ${secondary}
        `;
      }

      if (key === "vehicle_type") {
        const vehicleType =
          normalize(value);

        if (vehicleType === "TRAILER") {
          return "Acoplado";
        }

        if (vehicleType === "TRUCK") {
          return "Camion";
        }
      }

      return esc(value ?? "");
    };

    function currentRows() {
      return (
        state.data?.[state.view] ||
        []
      );
    }

    function isTrozasRisk(row) {
      const isLasAcacias =
        normalize(row.destino)
          .includes("LAS ACACIAS");

      const expired = [
        documentStatus(
          row.driver_license,
          "conductores"
        ),
        documentStatus(
          row.health_meat,
          "conductores"
        ),
        documentStatus(
          row.identity_card,
          "conductores"
        ),
        documentStatus(
          row.psychotechnician,
          "conductores"
        )
      ].some(
        value =>
          normalize(value) === "VENCIDO"
      );

      return isLasAcacias && expired;
    }

    function fillFilters() {
      const config =
        configs[state.view];

      const rows =
        currentRows();

      const companies = [
        ...new Set(
          rows
            .map(config.company)
            .filter(Boolean)
        )
      ].sort(
        (first, second) =>
          first.localeCompare(
            second,
            "es"
          )
      );

      $("companyFilter").innerHTML =
        '<option value="">Todas</option>' +
        companies
          .map(
            company =>
              `<option>${esc(company)}</option>`
          )
          .join("");

      const statuses = [
        ...new Set(
          rows
            .map(row =>
              rowGeneralStatus(
                row,
                state.view
              )
            )
            .filter(Boolean)
        )
      ].sort();

      $("statusFilter").innerHTML =
        '<option value="">Todos</option>' +
        statuses
          .map(
            status =>
              `<option>${esc(status)}</option>`
          )
          .join("");
    }

    function filteredRows() {
      const config =
        configs[state.view];

      const searchValue =
        normalize(
          $("search").value
        );

      const selectedCompany =
        $("companyFilter").value;

      const selectedStatus =
        $("statusFilter").value;

      let rows =
        currentRows().filter(row => {
          const matchesText =
            !searchValue ||
            normalize(
              Object.values(row).join(" ")
            ).includes(searchValue);

          const matchesCompany =
            !selectedCompany ||
            config.company(row) ===
              selectedCompany;

          const matchesStatus =
            !selectedStatus ||
            rowGeneralStatus(
              row,
              state.view
            ) === selectedStatus;

          const matchesTrozas =
            state.view !== "conductores" ||
            !state.trozasOnly ||
            isTrozasRisk(row);

          return (
            matchesText &&
            matchesCompany &&
            matchesStatus &&
            matchesTrozas
          );
        });

      if (state.sortKey) {
        rows.sort((first, second) => {
          let firstValue;
          let secondValue;

          if (
            state.sortKey ===
            "estado_general"
          ) {
            firstValue =
              rowGeneralStatus(
                first,
                state.view
              );

            secondValue =
              rowGeneralStatus(
                second,
                state.view
              );
          } else {
            firstValue =
              first[state.sortKey];

            secondValue =
              second[state.sortKey];
          }

          const comparison =
            normalize(firstValue)
              .localeCompare(
                normalize(secondValue),
                "es",
                {
                  numeric:true
                }
              );

          return comparison *
            (state.sortAsc ? 1 : -1);
        });
      }

      return rows;
    }

    function setSummaryCount(
      id,
      section,
      status
    ) {
      const rows =
        state.data?.[section] || [];

      const count =
        rows.filter(row =>
          normalize(
            rowGeneralStatus(
              row,
              section
            )
          ) === status
        ).length;

      const button = $(id);

      button.textContent =
        count.toLocaleString("es-UY");

      button.disabled =
        count === 0;
    }

    function updateCards(rows) {
      const allRows =
        currentRows();

      $("totalLabel").textContent =
        configs[state.view].label;

      $("totalValue").textContent =
        allRows.length
          .toLocaleString("es-UY");

      setSummaryCount(
        "summaryEmpresasWarn",
        "empresas",
        "POR VENCER"
      );

      setSummaryCount(
        "summaryEmpresasBad",
        "empresas",
        "VENCIDO"
      );

      setSummaryCount(
        "summaryVehiculosWarn",
        "vehiculos",
        "POR VENCER"
      );

      setSummaryCount(
        "summaryVehiculosBad",
        "vehiculos",
        "VENCIDO"
      );

      setSummaryCount(
        "summaryConductoresWarn",
        "conductores",
        "POR VENCER"
      );

      setSummaryCount(
        "summaryConductoresBad",
        "conductores",
        "VENCIDO"
      );

      const trozasCard =
        $("trozasCard");

      const driverRows =
        state.data?.conductores || [];

      const trozasCount =
        driverRows.filter(
          isTrozasRisk
        ).length;

      trozasCard.classList.toggle(
        "risk",
        trozasCount > 0
      );

      trozasCard.classList.toggle(
        "safe",
        trozasCount === 0
      );

      trozasCard.classList.toggle(
        "active",
        state.view === "conductores" &&
        state.trozasOnly
      );

      $("trozasValue").textContent =
        trozasCount
          .toLocaleString("es-UY");

      document
        .querySelectorAll(
          ".summary-count"
        )
        .forEach(button => {
          const selected =
            button.dataset.summaryView ===
              state.view &&
            button.dataset.summaryStatus ===
              $("statusFilter").value;

          button.classList.toggle(
            "active",
            selected
          );

          button.setAttribute(
            "aria-pressed",
            selected ? "true" : "false"
          );
        });

      $("resultCount").textContent =
        `Mostrando ${
          rows.length.toLocaleString("es-UY")
        } de ${
          allRows.length.toLocaleString("es-UY")
        } registros`;
    }

    function render() {
      const config =
        configs[state.view];

      const rows =
        filteredRows();

      updateCards(rows);

      if (!rows.length) {
        $("tableWrap").innerHTML = `
          <div class="empty">
            No hay registros para los filtros seleccionados.
          </div>
        `;

        return;
      }

      const tableHead =
        config.columns
          .map((column, index) => {
            const key = column[0];
            const label = column[1];

            const sortIndicator =
              state.sortKey === key
                ? (
                    state.sortAsc
                      ? " ↑"
                      : " ↓"
                  )
                : "";

            return `
              <th
                class="${
                  index === 0
                    ? "sticky-first"
                    : ""
                }"
                data-key="${esc(key)}"
              >
                ${esc(label)}
                ${sortIndicator}
              </th>
            `;
          })
          .join("");

      const tableBody =
        rows
          .map(row => {
            const cells =
              config.columns
                .map((column, index) => `
                  <td class="${
                    index === 0
                      ? "sticky-first"
                      : ""
                  }">
                    ${renderCell(
                      row,
                      column
                    )}
                  </td>
                `)
                .join("");

            return `<tr>${cells}</tr>`;
          })
          .join("");

      const companyColumns =
        state.view === "empresas"
          ? `
            <colgroup>
              <col width="16.6667%">
              <col width="16.6667%">
              <col width="16.6667%">
              <col width="16.6667%">
              <col width="16.6667%">
              <col width="16.6667%">
            </colgroup>
          `
          : "";

      $("tableWrap").innerHTML = `
        <table class="view-${state.view}">
          ${companyColumns}

          <thead>
            <tr>
              ${tableHead}
            </tr>
          </thead>

          <tbody>
            ${tableBody}
          </tbody>
        </table>
      `;

      document
        .querySelectorAll(
          "th[data-key]"
        )
        .forEach(header => {
          header.addEventListener(
            "click",
            () => {
              const key =
                header.dataset.key;

              if (
                state.sortKey === key
              ) {
                state.sortAsc =
                  !state.sortAsc;
              } else {
                state.sortKey = key;
                state.sortAsc = true;
              }

              render();
            }
          );
        });
    }

    function switchView(view) {
      state.view = view;
      state.sortKey = null;
      state.sortAsc = true;
      state.trozasOnly = false;

      document
        .querySelectorAll(".tab")
        .forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.view === view
          );
        });

      $("search").value = "";
      $("companyFilter").value = "";
      $("statusFilter").value = "";

      fillFilters();
      render();
    }

    async function load() {
      try {
        const response =
          await fetch(
            `${SOURCE}?v=${Date.now()}`,
            {
              cache:"no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        state.data =
          await response.json();

        $("updated").textContent =
          `Actualizado: ${
            state.data.actualizado ||
            "sin fecha"
          }`;

        fillFilters();
        render();

      } catch (error) {
        $("updated").textContent =
          "No se pudo cargar la información";

        $("tableWrap").innerHTML = `
          <div class="error">
            <strong>
              No se pudieron cargar los datos
            </strong>
            <br>
            Comprueba la configuración del Secret
            DROPBOX_JSON_URL.
          </div>
        `;

        console.error(error);
      }
    }

    document
      .querySelectorAll(".tab")
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            switchView(
              button.dataset.view
            );
          }
        );
      });

    document
      .querySelectorAll(
        ".summary-count"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            switchView(
              button.dataset.summaryView
            );

            $("statusFilter").value =
              button.dataset.summaryStatus;

            state.trozasOnly = false;

            render();
          }
        );
      });

    $("search").addEventListener(
      "input",
      render
    );

    $("companyFilter").addEventListener(
      "change",
      render
    );

    $("statusFilter").addEventListener(
      "change",
      render
    );

    $("clearFilters").addEventListener(
      "click",
      () => {
        $("search").value = "";
        $("companyFilter").value = "";
        $("statusFilter").value = "";
        state.trozasOnly = false;

        render();
      }
    );

    $("trozasCard").addEventListener(
      "click",
      () => {
        if (
          state.view !== "conductores"
        ) {
          switchView("conductores");
          state.trozasOnly = true;
        } else {
          state.trozasOnly =
            !state.trozasOnly;
        }

        render();
      }
    );

    load();
  </script>
</body>
</html>
